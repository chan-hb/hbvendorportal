<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ED3B86">
  <title>Offline | Huda Beauty Vendor Portal</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #FDF4F8; color: #1A1A1A; padding: 16px; box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif; text-align: center;
    }
    main { max-width: 360px; }
    img { width: 96px; height: 96px; border-radius: 20px; }
    h1 { font-family: "Arial Black", Impact, sans-serif; text-transform: uppercase; font-size: 20px; letter-spacing: .04em; margin: 20px 0 8px; }
    p { font-size: 15px; line-height: 1.5; color: rgba(26,26,26,.7); margin: 0 0 24px; }
    button {
      font: inherit; font-weight: 700; color: #fff; background: #ED3B86; border: 0;
      border-radius: 999px; padding: 12px 28px; cursor: pointer;
    }
    button:hover { background: #D42F76; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Huda Beauty">
    <h1>You're offline</h1>
    <p>The vendor portal needs an internet connection. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
