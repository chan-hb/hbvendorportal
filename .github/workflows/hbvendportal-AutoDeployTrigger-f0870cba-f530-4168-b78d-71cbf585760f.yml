name: Trigger auto deployment for hbvendportal

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/hbvendportal-AutoDeployTrigger-f0870cba-f530-4168-b78d-71cbf585760f.yml'

  # Allow manual trigger 
  workflow_dispatch:
      
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.HBVENDPORTAL_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: hbvendportal.azurecr.io
          registryUsername: ${{ secrets.HBVENDPORTAL_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.HBVENDPORTAL_REGISTRY_PASSWORD }}
          containerAppName: hbvendportal
          resourceGroup: hb-business-apps
          imageToBuild: hbvendportal.azurecr.io/hbvendportal:${{ github.sha }}
          
            

     

