name: Build and deploy to Azure Container Apps

# Uses the secrets the Azure portal's continuous deployment wizard created
# (HBVENDPORTAL_*), plus three added by hand for the registry and app names.
#
# Images are tagged with the commit SHA rather than "latest", so rolling back is
# a matter of redeploying an older tag.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Sign in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.HBVENDPORTAL_REGISTRY_USERNAME }}
          password: ${{ secrets.HBVENDPORTAL_REGISTRY_PASSWORD }}

      - name: Build and push
        run: |
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/vendor-portal:${GITHUB_SHA::7}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.HBVENDPORTAL_AZURE_CREDENTIALS }}

      - name: Deploy
        run: |
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image "$IMAGE"

      - name: Report the deployed revision
        run: |
          az containerapp revision list \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "[?properties.active].{revision:name, created:properties.createdTime}" \
            --output table
